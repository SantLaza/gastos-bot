spring.application.name=gastos-bot

# Base H2 en memoria: se crea al arrancar y se borra al cortar
spring.datasource.url=jdbc:h2:mem:gastosdb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 para ver las tablas
spring.h2.console.enabled=true

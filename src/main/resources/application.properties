spring.application.name=gastos-bot

# Base H2 en memoria: se crea al arrancar y se borra al cortar
spring.datasource.url=jdbc:h2:mem:gastosdb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 para ver las tablas
spring.h2.console.enabled=true

# Token del bot de Telegram (te lo da @BotFather).
# NUNCA lo escribas acá: se lee de la variable de entorno TELEGRAM_BOT_TOKEN.
# Si la variable no está definida, el bot no arranca (así los tests no se conectan a Telegram).
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
